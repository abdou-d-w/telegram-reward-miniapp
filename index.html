<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reward Arena</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>

    <div class="app">

        <!-- Header -->
        <header class="header">
            <div>
                <p class="welcome">Welcome back 👋</p>
                <h1 id="username">Player</h1>
            </div>

            <div class="avatar" id="avatar">
                👤
            </div>
        </header>


        <!-- Balance -->
        <section class="balance-card">

            <p>Your Balance</p>

            <div class="balance">
                <span id="balance">0</span>
                <span class="points">PTS</span>
            </div>

            <button id="playButton">
                🎮 PLAY NOW
            </button>

        </section>


        <!-- Features -->
        <section class="features">

            <div class="feature-card" id="rewards">
                <div class="icon">🎁</div>
                <h3>Rewards</h3>
                <p>Claim rewards</p>
            </div>

            <div class="feature-card" id="referral">
                <div class="icon">👥</div>
                <h3>Referral</h3>
                <p>Invite friends</p>
            </div>

            <div class="feature-card" id="leaderboard">
                <div class="icon">🏆</div>
                <h3>Ranking</h3>
                <p>Top players</p>
            </div>

            <div class="feature-card" id="profile">
                <div class="icon">👤</div>
                <h3>Profile</h3>
                <p>Your account</p>
            </div>

        </section>


        <!-- Navigation -->
        <nav class="bottom-nav">

            <button class="nav-item active">
                🏠
                <span>Home</span>
            </button>

            <button class="nav-item">
                🎁
                <span>Rewards</span>
            </button>

            <button class="nav-item">
                👥
                <span>Invite</span>
            </button>

            <button class="nav-item">
                👤
                <span>Profile</span>
            </button>

        </nav>

    </div>


    <script src="app.js"></script>

</body>
</html>
